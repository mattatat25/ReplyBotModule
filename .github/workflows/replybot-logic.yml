name: ReplyBot logic tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build host-side logic tests
        run: g++ -std=c++11 -Wall -Wextra -Werror tests/replybot_logic_test.cpp -o /tmp/replybot_logic_test

      - name: Run host-side logic tests
        run: /tmp/replybot_logic_test
